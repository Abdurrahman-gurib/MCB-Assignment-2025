<div style="max-width: 500px; margin: 0 auto; text-align: center; padding: 20px;">
    <h2>Register</h2>
    <h3 style="font-weight: normal; font-size: 1em; margin-bottom: 20px;">
      Assignment | Software Engineer (Core Banking - Payments) | Tech. Engineering Chapter | Technology SBU | February 2025
    </h3>
  
    <form (ngSubmit)="register()" style="text-align: left;">
      <label for="username">Username:</label>
      <input id="username" type="text" [(ngModel)]="user.username" name="username" required style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px;"/>
      
      <label for="password">Password:</label>
      <input id="password" type="password" [(ngModel)]="user.password" name="password" required style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px;"/>
      
      <button type="submit" style="width: 100%; padding: 10px; background: linear-gradient(135deg, #00509e, #003366); border: none; border-radius: 5px; color: white; font-size: 1.1em; cursor: pointer; transition: background 0.3s ease;">Register</button>
    </form>
  </div>
